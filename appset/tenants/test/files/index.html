<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>test — v1</title>
<style>
  /* ---- CHANGE THESE TWO LINES TO DEMO A SYNC ---- */
  :root {
    --release: "v1";
    --band: #c2734c;
  }
  /* ----------------------------------------------- */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #14181c;
    color: #e8ecef;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  .panel {
    width: min(560px, 92vw);
    border: 1px solid #2a3238;
    border-top: 6px solid var(--band);
    background: #191f24;
    padding: 2.5rem 2rem 2rem;
  }
  .eyebrow {
    margin: 0 0 1.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7d8b95;
  }
  .release {
    font-size: clamp(3.5rem, 14vw, 6rem);
    line-height: 1;
    font-weight: 700;
    color: var(--band);
    word-break: break-all;
  }
  .release::before { content: var(--release); }
  .message {
    margin: 1.25rem 0 2rem;
    font-size: 1.05rem;
    line-height: 1.5;
    color: #b9c4cc;
  }
  dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem 1.5rem;
    margin: 0;
    padding-top: 1.5rem;
    border-top: 1px solid #2a3238;
    font-size: 0.85rem;
  }
  dt { color: #7d8b95; }
  dd { margin: 0; color: #e8ecef; word-break: break-all; }
</style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">ApplicationSet tenant &middot; test</p>
    <div class="release"></div>

    <!-- CHANGE THIS LINE TOO -->
    <p class="message">Same base manifests as the others. Only this page, the replica count and the node port differ.</p>

    <dl>
      <dt>Generated by</dt><dd>ApplicationSet (git directories)</dd>
      <dt>Path</dt><dd>appset/tenants/test/files/index.html</dd>
    </dl>
  </main>
</body>
</html>
