# Input template for the Octopus "Update Argo CD Application Manifests" step.
# Octopus substitutes #{...} variables at deployment time and commits the
# result into the target Application's path. Nothing here is applied by
# kustomize — this is a plain directory source.

apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-site
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>#{Octopus.Environment.Name} — #{Octopus.Release.Number}</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center;
             background:#14181c; color:#e8ecef;
             font-family: ui-monospace, Menlo, Consolas, monospace; }
      .panel { width:min(560px,92vw); border:1px solid #2a3238;
               border-top:6px solid #{BandColour}; background:#191f24;
               padding:2.5rem 2rem 2rem; }
      .eyebrow { margin:0 0 1.75rem; font-size:.75rem; letter-spacing:.18em;
                 text-transform:uppercase; color:#7d8b95; }
      .release { font-size:clamp(3rem,12vw,5rem); line-height:1; font-weight:700;
                 color:#{BandColour}; word-break:break-all; }
      dl { display:grid; grid-template-columns:auto 1fr; gap:.5rem 1.5rem;
           margin:1.5rem 0 0; padding-top:1.5rem; border-top:1px solid #2a3238;
           font-size:.85rem; }
      dt { color:#7d8b95; } dd { margin:0; }
    </style>
    </head>
    <body>
      <main class="panel">
        <p class="eyebrow">Manifest written by Octopus</p>
        <div class="release">#{Octopus.Release.Number}</div>
        <dl>
          <dt>Environment</dt><dd>#{Octopus.Environment.Name}</dd>
          <dt>Project</dt><dd>#{Octopus.Project.Name}</dd>
          <dt>Deployed</dt><dd>#{Octopus.Deployment.Created}</dd>
        </dl>
      </main>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  labels:
    app: demo-web
spec:
  replicas: #{Replicas}
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
      annotations:
        # There is no kustomize hash here, so nothing would otherwise force a
        # rollout when the ConfigMap contents change. The release number does
        # it instead: a new release means a new pod spec.
        octopus.com/release: "#{Octopus.Release.Number}"
    spec:
      containers:
        - name: nginx
          image: nginx:#{ImageTag}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: site
          configMap:
            name: demo-site

---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  labels:
    app: demo-web
spec:
  type: NodePort
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: #{NodePort}
